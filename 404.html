<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصفحة نايمة · نسق استديو</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Fraunces:opsz,wght,SOFT,WONK@9..144,900,100,1&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Lalezar&display=swap">
<script>
  (function (d) {
    var l; try { l = localStorage.getItem('nasaq-lang'); } catch (e) {}
    if (l === 'en') { d.lang = 'en'; d.dir = 'ltr'; d.title = 'This page is asleep · Nasaq Studio'; }
  })(document.documentElement);
</script>
<link rel="stylesheet" href="/assets/style.css">
<style>
  .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding-block: 40px; position: relative; overflow: hidden; }
  .lost-in { position: relative; z-index: 1; display: grid; justify-items: center; gap: 14px; }
  .lost .zzz { width: clamp(200px, 30vw, 300px); }
  .lost h1 { margin: 0; font-family: var(--display); font-size: clamp(40px, 7vw, 80px); line-height: 1.15; }
  .lost .code { font-family: "Fraunces", Georgia, serif; font-weight: 900; letter-spacing: .14em; color: var(--red); }
  .lost p { margin: 0 0 8px; color: var(--ink-2); max-width: 40ch; }
  html[lang="en"] [lang-ar], html[lang="ar"] [lang-en] { display: none; }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="lost wrap">
  <div class="rays" aria-hidden="true"></div>
  <div class="lost-in">
    <div class="zzz" id="zzz"></div>
    <div class="code">404</div>
    <h1><span lang-ar>الصفحة نايمة</span><span lang-en>This page is asleep</span></h1>
    <p><span lang-ar>نون ما لقى الصفحة اللي تدور عليها. خلّه يرتاح وارجع للرئيسية.</span><span lang-en>Noon couldn't find the page you were looking for. Let him rest and head back home.</span></p>
    <a class="btn btn-ink" href="/"><span lang-ar>الرئيسية</span><span lang-en>Home</span> <span class="arr">↗</span></a>
  </div>
</main>
<script src="/assets/noon.js"></script>
<script>
  document.getElementById('zzz').innerHTML = noonSVG({ pose: 'idle', face: 'sleep', label: 'Noon asleep' });
  (function () {
    var c = document.createElement('canvas'); c.width = c.height = 160;
    var x = c.getContext('2d'), d = x.createImageData(160, 160);
    for (var i = 0; i < d.data.length; i += 4) { var v = Math.random() * 255 | 0; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 70; }
    x.putImageData(d, 0, 0); document.querySelector('.grain').style.backgroundImage = 'url(' + c.toDataURL() + ')';
  })();
</script>
<!-- Vercel Web Analytics (cookie-free page views) -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
