<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project · Nasaq Studio</title>
<meta property="og:image" content="https://nasaqstudio.online/assets/og.png">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<script>
  (function (d) {
    // Arabic is the default; English only when the visitor picked it
    var l; try { l = localStorage.getItem('nasaq-lang'); } catch (e) {}
    if (l !== 'en') { d.lang = 'ar'; d.dir = 'rtl'; }
    // Fonts for this language only. Arabic fonts live on this site (no extra connections on a slow
    // link) and the headline font is fetched first, so the hero shows in its final font from the start.
    var add = function (rel, href, as) {
      var l = document.createElement('link'); l.rel = rel; l.href = href;
      if (as) { l.as = as; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; }
      document.head.appendChild(l);
    };
    if (d.lang === 'ar') {
      add('preload', 'assets/fonts/lalezar-400-arabic.woff2', 'font');
      add('stylesheet', 'assets/fonts/fonts-ar.css');
    } else {
      add('stylesheet', 'https://fonts.googleapis.com/css2?display=swap&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800' +
        '&family=Fraunces:opsz,wght,SOFT,WONK@9..144,800..900,0..100,0..1');
    }
    // Slow or data-saving connections skip the 3D models and wait for a tap before playing video
    var c = navigator.connection || {};
    if (c.saveData || /(^|-)2g|3g/.test(c.effectiveType || '') || (c.downlink && c.downlink < 1.5)) d.classList.add('is-slow');
    d.classList.add('js-intro');
  })(document.documentElement);
</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

    </a>
    <span class="nav-gap"></span>
    <button class="lang-btn" id="lang-tab" type="button"></button>
  </div>
</header>

  </div>
</footer>
